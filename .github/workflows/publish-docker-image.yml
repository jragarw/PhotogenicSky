name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - "docker-app/**"
      - ".github/workflows/publish-docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version and image owner
        id: app
        shell: bash
        run: |
          version="$(tr -d '\r\n' < docker-app/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "docker-app/VERSION must contain a semantic version, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the app image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-app
          push: true
          build-args: APP_VERSION=${{ steps.app.outputs.version }}
          tags: |
            ghcr.io/${{ steps.app.outputs.owner }}/photogenic-sky:latest
            ghcr.io/${{ steps.app.outputs.owner }}/photogenic-sky:${{ steps.app.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.app.outputs.version }}
