name: Docker app

on:
  pull_request:
    paths:
      - "docker-app/**"
      - ".github/workflows/docker-app.yml"
  push:
    paths:
      - "docker-app/**"
      - ".github/workflows/docker-app.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run application tests
        run: python -m unittest discover -s docker-app/tests -v
      - name: Check browser JavaScript syntax
        run: node --check docker-app/static/app.js
      - name: Build Docker image
        run: docker build --tag photogenic-sky:ci docker-app
      - name: Start container and check health endpoint
        run: |
          docker run --detach --name photogenic-sky-ci --publish 127.0.0.1:18080:8080 photogenic-sky:ci
          trap 'docker logs photogenic-sky-ci; docker rm --force photogenic-sky-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
