services:
  photogenic-sky:
    image: ghcr.io/jragarw/photogenic-sky:latest
    pull_policy: always
    container_name: photogenic-sky
    restart: unless-stopped
    user: "${PUID:-568}:${PGID:-568}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      CACHE_SECONDS: "14400"
      APP_USERNAME: "${APP_USERNAME:-photogenic}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
    volumes:
      - /mnt/FastStorage/docker/data/codeserver/photogenic-sky:/data
